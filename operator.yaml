# The operator as the analytics stack registers it (§5.14).
#
# ODE offers registration as an explicit action and never performs it on its own,
# so this file is the payload that action sends. Edit it here; it is the source of
# truth for what the pipeline editor will show.
name: ode-ablation-pv-l2-rerun-1
description: >
  24-hour-ahead forecast of hourly mean PV power (W). Uses the day-ahead
  irradiance forecast from open-meteo.com (needs outbound HTTPS) and falls back
  to a clear-sky-index model without weather.
image: ghcr.io/senergy-platform/ode-ablation-pv-l2-rerun-1:latest

# Public makes the operator visible to other users of the platform. Registration
# is a developer decision and so is this.
pub: false
deploymentType: local

# What the pipeline editor offers as inputs. "name" has to match a selector arg in
# op.py — the two together are how a message reaches infer().
inputs:
  - name: value
    type: float

# What the operator emits: the forecast hourly mean power in W for the hour the
# output is timestamped with (message time + 24 h), and which forecaster made it.
outputs:
  - name: prediction
    type: float
  - name: source
    type: string

# Deployment configuration, matching CustomConfig in op.py.
config_values:
  - name: retrain_after_s
    type: int
  - name: latitude
    type: float
  - name: longitude
    type: float
  - name: use_weather
    type: bool
